- name: Installer les pré-requis
  become: true
  apt:
    name:
      - curl
      - unzip
    state: present

- name: Télécharger Vault
  become: true
  get_url:
    url: "{{ vault_download_url }}"
    dest: "/tmp/vault.zip"
  when: primo_install is defined 

- name: Décompresser Vault
  become: true
  unarchive:
    src: "/tmp/vault.zip"
    dest: "/tmp/"
    remote_src: yes

- name: Déplacer Vault dans /usr/local/bin
  become: true
  command: mv /tmp/vault {{ vault_install_path }}/vault creates={{ vault_install_path }}/vault

- name: Créer un utilisateur Vault
  become: true
  user:
    name: vault
    system: yes
    home: "/etc/vault.d"
    shell: "/bin/false"

- name: Créer le dossier de configuration
  become: true
  file:
    path: "/etc/vault.d"
    state: directory
    owner: vault
    group: vault
    mode: "0755"

# - name: Copier le fichier de configuration vault.hcl
#   become: true
#   copy:
#     src: "vault.hcl"
#     dest: "{{ vault_config_path }}"
#     owner: vault
#     group: vault
#     mode: "0644"

- name: Dépôt du fichier de configuration
  template:
    src: vault.hcl.j2
    dest: "{{ vault_config_path }}"
    owner: vault
    group: vault
    mode: "0644"
    
- name: Créer le dossier pour stocker les données de Vault
  become: true
  file:
    path: "{{ vault_data_path }}"
    state: directory
    owner: vault
    group: vault
    mode: "0755"

- name: Deploy TLS files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: "signed_certificate.pem", dest: "/etc/ssl/certs/signed_certificate.pem", owner: "root", group: "root", mode: "0644" }
    - { src: "private.key", dest: "/etc/ssl/private/private.key", owner: "root", group: "root", mode: "0600" }
    - { src: "ca_chain.crt", dest: "/etc/ssl/certs/ca_chain.crt", owner: "root", group: "root", mode: "0644" }
