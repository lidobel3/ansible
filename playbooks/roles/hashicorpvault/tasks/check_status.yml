- name: Vérifier l'état de Vault
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/health"
    method: GET
    status_code: [200, 429, 472, 473, 501, 503]
    return_content: yes
    ca_path: "/etc/ssl/certs/ca_chain.crt"
  register: vault_health
  failed_when: false
  
