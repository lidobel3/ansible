[defaults]
#verbosity = 3 La verbosité est déja un paramètre de build
remote_user = vagrant
private_key_file = ~/.ssh/id_peoservices
interpreter_python = /usr/bin/python3
host_key_checking = False
collections_paths = /usr/lib/python3/dist-packages/ansible_collections:/var/jenkins_home/.ansible/collections/ansible_collections
retry_files_enabled = False

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no
pipelining = True
